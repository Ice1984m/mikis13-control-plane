<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mikis13 Control Plane</title>
<style>
body{
  margin:0;
  background:#05030a;
  color:#eee;
  font-family:system-ui,sans-serif
}
main{
  width:min(1100px,calc(100% - 30px));
  margin:auto;
  padding:32px 0
}
.hero,.card{
  background:#0d0916;
  border:1px solid #713da3;
  border-radius:20px;
  padding:22px
}
.hero{margin-bottom:18px}
h1{
  font-size:clamp(42px,8vw,78px);
  color:#decaff
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px
}
.green{color:#56ffaf}
.cyan{color:#57e5ff}
</style>
</head>
<body>
<main>
<section class="hero">
<div class="green">MIKIS13 CONTROL PLANE V2</div>
<h1>One Control Center</h1>
<p class="cyan">Website • GitHub • Security • Containers • Repair • Releases</p>
</section>
<section class="grid">
<div class="card">🌐 Live Status</div>
<div class="card">🤖 Repair Bot</div>
<div class="card">🐳 Containers</div>
<div class="card">🛡 Security</div>
<div class="card">🧪 E2E</div>
<div class="card">📊 History</div>
<div class="card">🚦 Release Gate</div>
<div class="card">📦 Releases</div>
<div class="card">📱 Termux Center</div>
<div class="card">🧠 Drift Detector</div>
</section>
</main>
</body>
</html>
